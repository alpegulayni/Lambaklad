<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090f17" />
  <meta name="description" content="GUFA — Guinacot United Fishermen's Association. Access the member masterlist, Bantay Schedule, and weekly attendance in one place." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="GUFA | Guinacot United Fishermen's Association" />
  <meta property="og:title" content="GUFA | Guinacot United Fishermen's Association" />
  <meta property="og:description" content="Member Masterlist, Bantay Schedule, and Attendance — the community hub of Guinacot United Fishermen's Association." />
  <meta property="og:url" content="https://alpegulayni.github.io/Lambaklad/" />
  <meta property="og:image" content="https://alpegulayni.github.io/Lambaklad/assets/gufa-social-preview.jpg" />
  <meta property="og:image:secure_url" content="https://alpegulayni.github.io/Lambaklad/assets/gufa-social-preview.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="GUFA — Guinacot United Fishermen's Association" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="GUFA | Guinacot United Fishermen's Association" />
  <meta name="twitter:description" content="Member Masterlist, Bantay Schedule, and Attendance in one place." />
  <meta name="twitter:image" content="https://alpegulayni.github.io/Lambaklad/assets/gufa-social-preview.jpg" />
  <title>GUFA | Guinacot United Fishermen's Association</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css" />
  <script src="data.js" defer></script>
  <script src="members.js" defer></script>
</head>
<body>
  <main class="schedule-shell">
    <header class="site-header row g-0">
      <div class="col-6 header-brand-col">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">⚓</div>
          <div class="brand-copy">
            <div class="brand-name">GUFA</div>
            <div class="association-name">
              <span>GUINACOT UNITED</span>
              <span>FISHERMEN'S ASSOCIATION</span>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 header-title-col">
        <h1 id="page-title">👥 MEMBER MASTERLIST</h1>
      </div>
      <nav class="gufa-menu-nav" aria-label="GUFA pages"><div class="dropdown"><button class="gufa-menu-toggle dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Open navigation menu"><span class="gufa-menu-icon" aria-hidden="true"><span></span><span></span><span></span></span></button><ul class="dropdown-menu dropdown-menu-end gufa-dropdown-menu"><li><a class="dropdown-item active" href="./" aria-current="page">Member Masterlist</a></li><li><a class="dropdown-item" href="schedule/">Bantay Schedule</a></li><li><a class="dropdown-item" href="attendance/">Attendance</a></li></ul></div></nav>
    </header>


    <section id="members-page" class="members-page" aria-label="Member masterlist">
      <div class="members-toolbar">
        <div class="members-count" id="members-count"></div>
      </div>
      <div class="members-filters">
        <input id="member-search" type="search" placeholder="Search member name..." aria-label="Search members">
        <details class="member-filter-dropdown" id="member-status-filter">
          <summary><span>Status</span><span class="filter-selection-count">All</span></summary>
          <div class="member-filter-panel">
            <div class="filter-panel-actions"><button type="button" data-filter-action="toggle">Select all</button></div>
            <label><input type="checkbox" value="Active"> Active</label>
            <label><input type="checkbox" value="Suspended"> Suspended</label>
            <label><input type="checkbox" value="Inactive"> Inactive</label>
          </div>
        </details>
        <details class="member-filter-dropdown" id="member-address-filter">
          <summary><span>Address</span><span class="filter-selection-count">All</span></summary>
          <div class="member-filter-panel">
            <div class="filter-panel-actions"><button type="button" data-filter-action="toggle">Select all</button></div>
            <label><input type="checkbox" value="Looc"> Looc</label>
            <label><input type="checkbox" value="Pasan"> Pasan</label>
            <label><input type="checkbox" value="Manga"> Manga</label>
            <label><input type="checkbox" value="East Guinacot"> East Guinacot</label>
            <label><input type="checkbox" value="Tawid Pasan"> Tawid Pasan</label>
            <label><input type="checkbox" value="Unassigned"> Unassigned</label>
          </div>
        </details>
      </div>
      <div class="members-table-wrap">
        <table class="members-table">
          <thead><tr>
            <th class="member-name-col lname-col"><button type="button" class="column-sort" data-member-sort="lastName">LNAME <span class="sort-indicator">↕</span></button></th>
            <th class="member-name-col fname-col"><button type="button" class="column-sort" data-member-sort="firstName">FNAME <span class="sort-indicator">↕</span></button></th>
            <th><button type="button" class="column-sort" data-member-sort="address">Address <span class="sort-indicator">↕</span></button></th>
            <th><button type="button" class="column-sort" data-member-sort="status">Status <span class="sort-indicator">↕</span></button></th>
          </tr></thead>
          <tbody id="members-table-body"></tbody>
        </table>
      </div>
      <p class="members-footnote">Members with no address are left unassigned. Changes are saved in this browser.</p>
    </section>


  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
