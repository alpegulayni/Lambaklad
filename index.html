<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090f17" />
  <title>GUFA | Member Masterlist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css" />
  <script src="data.js" defer></script>
  <script src="members.js" defer></script>
</head>
<body>
  <main class="schedule-shell">
    <header class="site-header row g-0">
      <div class="col-6 header-brand-col">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">⚓</div>
          <div class="brand-copy">
            <div class="brand-name">GUFA</div>
            <div class="association-name">
              <span>GUINACOT UNITED</span>
              <span>FISHERMEN'S ASSOCIATION</span>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 header-title-col">
        <h1 id="page-title">👥 MEMBER MASTERLIST</h1>
      </div>
      <nav class="gufa-menu-nav" aria-label="GUFA pages"><div class="dropdown"><button class="gufa-menu-toggle dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Open navigation menu"><span class="gufa-menu-icon" aria-hidden="true"><span></span><span></span><span></span></span></button><ul class="dropdown-menu dropdown-menu-end gufa-dropdown-menu"><li><a class="dropdown-item active" href="schedule/" >Bantay Schedule</a></li><li><a class="dropdown-item" href="./" aria-current="page">Member Masterlist</a></li><li><a class="dropdown-item" href="attendance/">Attendance</a></li></ul></div></nav>
    </header>


    <section id="members-page" class="members-page" aria-label="Member masterlist">
      <div class="members-toolbar">
        <div class="members-count" id="members-count"></div>
      </div>
      <div class="members-filters">
        <input id="member-search" type="search" placeholder="Search member name..." aria-label="Search members">
        <select id="member-status-filter" aria-label="Filter by status">
          <option value="All">All statuses</option><option value="Active">Active</option><option value="Suspended">Suspended</option><option value="Inactive">Inactive</option>
        </select>
        <select id="member-position-filter" aria-label="Filter by position">
          <option value="All">All positions</option><option>President</option><option>Vice President</option><option>Treasurer</option><option>Secretary</option><option>Member</option>
        </select>
        <select id="member-address-filter" aria-label="Filter by address">
          <option value="All">All addresses</option><option value="Looc">Looc</option><option value="Pasan">Pasan</option><option value="Manga">Manga</option><option value="East Guinacot">East Guinacot</option><option value="Unassigned">Unassigned</option>
        </select>
      </div>
      <div class="members-table-wrap">
        <table class="members-table">
          <thead><tr>
            <th><button type="button" class="column-sort" data-member-sort="lastName">Last Name <span class="sort-indicator">↕</span></button></th>
            <th><button type="button" class="column-sort" data-member-sort="firstName">First Name <span class="sort-indicator">↕</span></button></th>
            <th><button type="button" class="column-sort" data-member-sort="address">Address <span class="sort-indicator">↕</span></button></th>
            <th><button type="button" class="column-sort" data-member-sort="position">Position <span class="sort-indicator">↕</span></button></th>
            <th><button type="button" class="column-sort" data-member-sort="status">Status <span class="sort-indicator">↕</span></button></th>
          </tr></thead>
          <tbody id="members-table-body"></tbody>
        </table>
      </div>
      <p class="members-footnote">Members with no address are left unassigned. Update addresses, officer positions, and statuses as needed. Changes are saved in this browser.</p>
    </section>


  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
