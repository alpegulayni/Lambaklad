<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090f17" />
  <meta name="description" content="GUFA attendance records and member attendance information — Guinacot United Fishermen's Association." />
  <link rel="canonical" href="https://alpegulayni.github.io/Lambaklad/attendance/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="GUFA | Guinacot United Fishermen's Association" />
  <meta property="og:title" content="GUFA | Attendance" />
  <meta property="og:description" content="GUFA attendance records and member attendance information — Guinacot United Fishermen's Association." />
  <meta property="og:url" content="https://alpegulayni.github.io/Lambaklad/attendance/" />
  <meta property="og:image" content="https://alpegulayni.github.io/Lambaklad/assets/attendance-social-preview.jpg" />
  <meta property="og:image:secure_url" content="https://alpegulayni.github.io/Lambaklad/assets/attendance-social-preview.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="GUFA — Guinacot United Fishermen's Association" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="GUFA | Attendance" />
  <meta name="twitter:description" content="GUFA attendance records and member attendance information — Guinacot United Fishermen's Association." />
  <meta name="twitter:image" content="https://alpegulayni.github.io/Lambaklad/assets/attendance-social-preview.jpg" />
  <title>GUFA | Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="../styles.css" />
  <script src="../data.js" defer></script>
  <script src="attendance.js" defer></script>
</head>
<body>
  <main class="schedule-shell">
    <header class="site-header row g-0">
      <div class="col-6 header-brand-col">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">⚓</div>
          <div class="brand-copy">
            <div class="brand-name">GUFA</div>
            <div class="association-name">
              <span>GUINACOT UNITED</span>
              <span>FISHERMEN'S ASSOCIATION</span>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 header-title-col">
        <h1>📋 ATTENDANCE</h1>
      </div>
      <nav class="gufa-menu-nav" aria-label="GUFA pages"><div class="dropdown"><button class="gufa-menu-toggle dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Open navigation menu"><span class="gufa-menu-icon" aria-hidden="true"><span></span><span></span><span></span></span></button><ul class="dropdown-menu dropdown-menu-end gufa-dropdown-menu"><li><a class="dropdown-item" href="../" >Member Masterlist</a></li><li><a class="dropdown-item" href="../schedule/">Bantay Schedule</a></li><li><a class="dropdown-item active" href="./" aria-current="page">Attendance</a></li></ul></div></nav>
    </header>


    <section class="attendance-page" aria-label="Weekly attendance">
<div class="attendance-tools">
        <input id="attendance-search" type="search" placeholder="Search member name..." aria-label="Search members" />
        <details class="member-filter-dropdown attendance-filter-dropdown" id="attendance-status-filter">
          <summary><span>Status</span><span class="filter-selection-count">All</span></summary>
          <div class="member-filter-panel">
            <div class="filter-panel-actions"><button type="button" data-filter-action="toggle">Select all</button></div>
            <label><input type="checkbox" value="Active"> Active</label>
            <label><input type="checkbox" value="Suspended"> Suspended</label>
            <label><input type="checkbox" value="Inactive"> Inactive</label>
          </div>
        </details>
        <details class="member-filter-dropdown attendance-filter-dropdown" id="attendance-address-filter">
          <summary><span>Address</span><span class="filter-selection-count">All</span></summary>
          <div class="member-filter-panel">
            <div class="filter-panel-actions"><button type="button" data-filter-action="toggle">Select all</button></div>
            <label><input type="checkbox" value="Looc"> Looc</label>
            <label><input type="checkbox" value="Pasan"> Pasan</label>
            <label><input type="checkbox" value="Manga"> Manga</label>
            <label><input type="checkbox" value="East Guinacot"> East Guinacot</label>
            <label><input type="checkbox" value="Tawid Pasan"> Tawid Pasan</label>
            <label><input type="checkbox" value="Unassigned"> Unassigned</label>
          </div>
        </details>
        <span class="attendance-key"><b>✓</b> Present = 1 full day</span>
      </div>
      <div class="attendance-table-wrap">
        <table class="attendance-table">
          <thead><tr class="day-heading"><th>Name</th><th>Loading attendance…</th><th>Absent (days)</th><th>Penalty</th></tr></thead>
          <tbody id="attendance-table-body"></tbody>
        </table>
      </div>
      <div class="attendance-footer"><span>Each date counts as one attendance mark.</span><span>Absent penalty: ₱600 whole day / ₱300 half day.</span></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
