<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090f17" />
  <title>GUFA | Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="../styles.css" />
  <script src="../data.js" defer></script>
  <script src="attendance.js" defer></script>
</head>
<body>
  <main class="schedule-shell">
    <header class="site-header row g-0">
      <div class="col-6 header-brand-col">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">⚓</div>
          <div class="brand-copy">
            <div class="brand-name">GUFA</div>
            <div class="association-name">
              <span>GUINACOT UNITED</span>
              <span>FISHERMEN'S ASSOCIATION</span>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 header-title-col">
        <h1>📋 ATTENDANCE</h1>
      </div>
      <nav class="gufa-menu-nav" aria-label="GUFA pages"><div class="dropdown"><button class="gufa-menu-toggle dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Open navigation menu"><span class="gufa-menu-icon" aria-hidden="true"><span></span><span></span><span></span></span></button><ul class="dropdown-menu dropdown-menu-end gufa-dropdown-menu"><li><a class="dropdown-item" href="../" >Member Masterlist</a></li><li><a class="dropdown-item" href="../schedule/">Bantay Schedule</a></li><li><a class="dropdown-item active" href="./" aria-current="page">Attendance</a></li></ul></div></nav>
    </header>


    <section class="attendance-page" aria-label="Weekly attendance">
      <div class="members-toolbar attendance-toolbar">
        <div class="attendance-summary" id="attendance-summary"></div>
      </div>
      <div class="attendance-tools">
        <input id="attendance-search" type="search" placeholder="Search member name..." aria-label="Search members" />
        <select id="attendance-status-filter" aria-label="Filter member status"><option value="Active">Active members</option><option value="All">All members</option><option value="Suspended">Suspended members</option><option value="Inactive">Inactive members</option></select>
        <select id="attendance-address-filter" aria-label="Filter by address"><option value="All">All addresses</option><option value="Looc">Looc</option><option value="Pasan">Pasan</option><option value="Manga">Manga</option><option value="East Guinacot">East Guinacot</option><option value="Tawid Pasan">Tawid Pasan</option><option value="Unassigned">Unassigned</option></select>
        <span class="attendance-key"><b>✓</b> Present = 1 full day</span>
      </div>
      <div class="attendance-table-wrap">
        <table class="attendance-table">
          <thead><tr class="day-heading"><th>Lname</th><th>Fname</th><th>Loading attendance…</th><th>Worked</th><th>Penalty</th></tr></thead>
          <tbody id="attendance-table-body"></tbody>
        </table>
      </div>
      <div class="attendance-footer"><span>Each date counts as one attendance mark.</span><span>Absent penalty: ₱600 whole day / ₱300 half day.</span></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
