<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090f17" />
  <title>GUFA | Member Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="../styles.css" />
  <script src="../data.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="schedule-shell">
    <header class="site-header row g-0">
      <div class="col-6 header-brand-col">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">⚓</div>
          <div class="brand-copy">
            <div class="brand-name">GUFA</div>
            <div class="association-name">
              <span>GUINACOT UNITED</span>
              <span>FISHERMEN'S ASSOCIATION</span>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 header-title-col">
        <h1 id="page-title">⚓ BANTAY SCHEDULE</h1>
      </div>
      <nav class="gufa-menu-nav" aria-label="GUFA pages"><div class="dropdown"><button class="gufa-menu-toggle dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Open navigation menu"><span class="gufa-menu-icon" aria-hidden="true"><span></span><span></span><span></span></span></button><ul class="dropdown-menu dropdown-menu-end gufa-dropdown-menu"><li><a class="dropdown-item" href="../" >Member Masterlist</a></li><li><a class="dropdown-item active" href="./" aria-current="page">Bantay Schedule</a></li><li><a class="dropdown-item" href="../attendance/">Attendance</a></li></ul></div></nav>
    </header>


    <section id="schedule-page" aria-label="Bantay schedule">
      <div id="schedule-grid" class="schedule-grid"></div>
    </section>


    <footer class="schedule-footer" id="schedule-footer">
      <div class="legend" aria-label="Schedule status legend">
        <span class="legend-item yesterday">YESTERDAY <span id="yesterday-date"></span></span>
        <span class="legend-item today">TODAY <span id="today-date"></span></span>
        <span class="legend-item upcoming">UPCOMING <span id="upcoming-range"></span></span>
      </div>
      <p id="schedule-summary">⚓ GUFA • 1 YESTERDAY • CURRENT • 8 UPCOMING</p>
    </footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
